<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IDENTIFY IT</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent!important;color:white;font-family:Arial,sans-serif}body{display:grid;place-items:center;padding:3vw}main{width:min(900px,94vw);padding:clamp(22px,4vw,48px);border:1px solid #ffffff55;border-radius:26px;background:linear-gradient(145deg,#111b35e8,#281544e8);box-shadow:0 12px 45px #0006;backdrop-filter:blur(12px);text-align:center}.eyebrow{font-size:13px;letter-spacing:.2em;color:#c8cfff;font-weight:800}h1{font-size:clamp(28px,5vw,58px);margin:14px 0}p{font-size:clamp(16px,2vw,22px);line-height:1.5;color:#e4e7f5}.controls{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:28px}button{border:0;border-radius:999px;padding:14px 24px;font-size:15px;font-weight:800;cursor:pointer;color:white;background:linear-gradient(100deg,#287cff,#9c4dff)}.secondary{background:#ffffff20;border:1px solid #ffffff55}</style></head><body><main><div class="eyebrow">THE RANDOMISER CHALLENGE</div><h1>IDENTIFY IT</h1><p>This is the starter screen for this category. We'll add its challenge content and interactions next.</p><p>Temporary test controls: award points to check the shared scoreboard.</p><div class="controls"><button onclick="award(20)">Award +20</button><button class="secondary" onclick="award(10)">Award +10</button><button class="secondary" onclick="award(0)">No points</button><button class="secondary" onclick="finish()">Return to wheel</button></div></main><script>function send(type,extra={}){parent.postMessage({source:'randomiser-challenge',type,...extra},'*')}function award(points){send('award',{points})}function finish(){send('complete')}</script></body></html>
